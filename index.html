<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #dbeafe, #f8fafc);
    }

    .calculator {
      width: 320px;
      padding: 20px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
    }

    .title {
      text-align: center;
      margin-bottom: 15px;
      font-size: 20px;
      color: #1e293b;
    }

    .display {
      width: 100%;
      height: 80px;
      padding: 15px;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      justify-content: flex-end;

      background: #111827;
      color: white;
      border-radius: 15px;

      font-size: 32px;
      overflow: hidden;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 60px;
      border: none;
      border-radius: 15px;
      background: #f1f5f9;
      color: #1e293b;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      background: #e2e8f0;
      transform: translateY(-2px);
    }

    button:active {
      transform: scale(0.95);
    }

    .operator {
      background: #dbeafe;
      color: #2563eb;
    }

    .clear {
      background: #fee2e2;
      color: #dc2626;
    }

    .equals {
      background: #2563eb;
      color: white;
    }

    .equals:hover {
      background: #1d4ed8;
    }

    .zero {
      grid-column: span 2;
    }
  </style>
</head>

<body>

  <div class="calculator">

    <h2 class="title">Mini Calculator</h2>

    <div class="display" id="display">0</div>

    <div class="buttons">

      <button class="clear" onclick="clearDisplay()">AC</button>
      <button onclick="deleteNumber()">⌫</button>
      <button class="operator" onclick="add('%')">%</button>
      <button class="operator" onclick="add('/')">÷</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button class="operator" onclick="add('*')">×</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button class="operator" onclick="add('-')">−</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button class="operator" onclick="add('+')">+</button>

      <button class="zero" onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>

    </div>
  </div>

  <script>
    const display = document.getElementById("display");

    let expression = "";

    function updateDisplay() {
      display.textContent = expression || "0";
    }

    function add(value) {
      expression += value;
      updateDisplay();
    }

    function clearDisplay() {
      expression = "";
      updateDisplay();
    }

    function deleteNumber() {
      expression = expression.slice(0, -1);
      updateDisplay();
    }

    function calculate() {
      try {
        if (!expression) return;

        let result = Function(
          '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
          throw new Error();
        }

        expression = String(result);
        updateDisplay();

      } catch {
        display.textContent = "Error";
        expression = "";
      }
    }

    // Keyboard support
    document.addEventListener("keydown", function(event) {

      const key = event.key;

      if ("0123456789.+-*/%".includes(key)) {
        add(key);
      }

      if (key === "Enter" || key === "=") {
        calculate();
      }

      if (key === "Backspace") {
        deleteNumber();
      }

      if (key === "Escape") {
        clearDisplay();
      }
    });
  </script>

</body>
</html>
